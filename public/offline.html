<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>أحمد الحربي | بدون اتصال</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --ink: #111; --muted: #767676; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --ink: #f2f2f0; --muted: #8c8c88; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.7; }
  button { font: inherit; font-weight: 700; padding: 12px 28px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>ما فيه اتصال</h1>
    <p>تأكد من الإنترنت وجرّب مرة ثانية.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
