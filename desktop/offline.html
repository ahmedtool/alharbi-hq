<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>ما فيه اتصال</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; font-family: "Segoe UI", Tahoma, sans-serif; background: #fff; color: #111; -webkit-app-region: drag; }
  .box { text-align: center; max-width: 320px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #666; font-size: 14px; margin: 0 0 20px; line-height: 1.7; }
  button { -webkit-app-region: no-drag; border: 0; border-radius: 999px; padding: 10px 22px; background: #111; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>ما فيه اتصال بالإنترنت</h1>
    <p>لوحة التحكم تحتاج إنترنت. تأكد من الاتصال واضغط حاول مرة ثانية.</p>
    <button onclick="window.alharbiDesktop && window.alharbiDesktop.retry()">حاول مرة ثانية</button>
  </div>
</body>
</html>
